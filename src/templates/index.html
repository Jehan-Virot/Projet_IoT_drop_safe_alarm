<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarme de la boîte aux lettres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index_style.css') }}">
</head>
<body>

    <main class="dashboard">

        <!-- Module 1 : Alarme -->
        <section class="module alarm-module">
            <h1>Alarme de la boîte aux lettres</h1>
            <p>Contrôle du système de surveillance</p>
            <button id="alarmButton">Chargement...</button>
        </section>

        <!-- Module 2 : Historique -->
        <section class="module history-module">
            <h2>Historique des événements</h2>
            <button id="historyButton">Afficher l'historique</button>

            <div id="history" hidden>
                <ul id="historyList"></ul>
            </div>
        </section>

        <!-- Module 3 : Graphiques -->
        <section class="module graphs-module">
            <h2>Statistiques</h2>

            <div class="graphs">
                <div class="graph">
                    <h3>Tentatives de vol</h3>
                    <img src="/graph/vols.png" alt="Historique des tentatives de vol">
                </div>

                <div class="graph">
                    <h3>Récupérations</h3>
                    <img src="/graph/recuperations.png" alt="Historique des récupérations">
                </div>

                <div class="graph">
                    <h3>Dépôts</h3>
                    <img src="/graph/depots.png" alt="Historique des dépôts">
                </div>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='index_script.js') }}"></script>
</body>
</html>
